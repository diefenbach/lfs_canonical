[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lfs-canonical"
version = "1.0.0"
description = "Provides canonical links for LFS"
readme = "README.txt"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Maciej Wisniowski" }]
maintainers = [{ name = "Kai Diefenbach" }]
keywords = ["django", "e-commerce", "online-shop"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "django-lfs>=1.0,<2",
]

[project.urls]
Source = "https://github.com/diefenbach/lfs-canonical"

[tool.setuptools.packages.find]
include = ["lfs_canonical*"]
